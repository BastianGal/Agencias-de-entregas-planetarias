<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio de Envíos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            text-align: center;
        }

        .contenedor {
            background-color: #333;
            width: 400px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: whitesmoke;
        }

        h3 {
            color: whitesmoke;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #resultado {
            margin-top: 20px;
            color: white;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Servicio de Envíos</h1>

        <p>Seleccione las características de su encargo.</p>

        <h3>1. Tipo de encargo</h3>

        <select id="tipoEnvio">
            <option value="">Seleccione un envío</option>
            <option value="Normal">Normal</option>
            <option value="Rápido">Rápido</option>
            <option value="Emergencia">Emergencia</option>
        </select>

        <h3>2. Tipo de contenido</h3>

        <select id="contenido">
            <option value="">Seleccione el contenido</option>
            <option value="Frágil">Frágil</option>
            <option value="No frágil">No frágil</option>
        </select>

        <br>

        <button onclick="confirmarEnvio()">
            Realizar Envio
        </button>

        <div id="resultado"></div>

    </div>

    <script>

        function confirmarEnvio() {

            let envio = document.getElementById("tipoEnvio").value;

            let contenido = document.getElementById("contenido").value;

            if (envio == "" || contenido == "") {

                alert("Debe seleccionar el tipo de envío y el contenido.");

            } else {

                document.getElementById("resultado").innerHTML =
                    "<h3>Encargo confirmado</h3>" +
                    "<p>Tipo de envío: " + envio + "</p>" +
                    "<p>Tipo de contenido: " + contenido + "</p>";
            }
        }

    </script>

</body>
</html>
