<body>

            </div>

    </div>

</nav>
    <div class="contenedor">

        <h1>Servicio de Envíos</h1>

        <p>Seleccione las características de su encargo.</p>

        <h3>1. Tipo de encargo</h3>

        <select id="tipoEnvio" class="form-select">
            <option value="">Seleccione un envío</option>
            <option value="Normal">Normal</option>
            <option value="Rápido">Rápido</option>
            <option value="Emergencia">Emergencia</option>
        </select>

        <h3>2. Tipo de contenido</h3>

        <select id="contenido" class="form-select">
            <option value="">Seleccione el contenido</option>
            <option value="Frágil">Frágil</option>
            <option value="No frágil">No frágil</option>
        </select>

        <button type="button" onclick="confirmarEnvio()">
            Realizar Envío
        </button>

        <div id="resultado" aria-live="polite"></div>

        <hr>

        <button type="button" onclick="volverMenu()">
            Volver al menú
        </button>

    </div>

    <script>

        function confirmarEnvio() {

            let envio = document.getElementById("tipoEnvio").value;
            let contenido = document.getElementById("contenido").value;

            let resultado = document.getElementById("resultado");

            if (envio == "" || contenido == "") {

                alert("Debe seleccionar el tipo de envío y el contenido.");
                return;

            }

            // Precios de demostración

            let precio = 0;

            if (envio == "Normal") {
                precio = 10000;
            }
            else if (envio == "Rápido") {
                precio = 20000;
            }
            else if (envio == "Emergencia") {
                precio = 35000;
            }

            if (contenido == "Frágil") {
                precio = precio + 5000;
            }

            // Crear solicitud

            let solicitud = {
                envio: envio,
                contenido: contenido,
                precio: precio,
                fecha: new Date().toLocaleString()
            };

            // Recuperar solicitudes guardadas

            let solicitudes = JSON.parse(
                localStorage.getItem("solicitudes")
            ) || [];

            // Agregar nueva solicitud

            solicitudes.push(solicitud);

            // Guardar solicitudes

            localStorage.setItem(
                "solicitudes",
                JSON.stringify(solicitudes)
            );

            // Mostrar resultado

            resultado.innerHTML =
                "<h3>Encargo registrado</h3>" +
                "<p>Tipo de envío: " + envio + "</p>" +
                "<p>Contenido: " + contenido + "</p>" +
                "<p>Precio estimado: $" + precio.toLocaleString("es-CL") + "</p>" +
                "<p>Fecha: " + solicitud.fecha + "</p>";

        }

        function volverMenu() {
            window.location.href = "Menu.html";
        }

    </script>
