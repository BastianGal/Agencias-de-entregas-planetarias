<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entregas de usuarios</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        .btn-volver {
            position: fixed;
            top: 18px;
            left: 18px;
            background: #282828;
            color: #0dcaf0;
            border: 1px solid #0dcaf0;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        h1 {
            text-align: center;
            color: #0dcaf0;
            margin-top: 35px;
        }
        .lista {
            max-width: 500px;
            margin: 25px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .usuario {
            background: #282828;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nombre {
            font-weight: bold;
            font-size: 17px;
        }
        .estado {
            font-size: 13px;
            color: #ffc107;
            margin-top: 4px;
        }
        button {
            border: none;
            border-radius: 6px;
            padding: 9px 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancelar {
            background: #dc3545;
            color: white;
        }
        .btn-validar {
            background: #0dcaf0;
            color: #111;
        }
        button:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <a class="btn-volver" href="#" onclick="history.back(); return false;">← Volver</a>

    <h1>Entregas de Usuarios</h1>

    <div class="lista">
        <div class="usuario">
            <div>
                <div class="nombre">Diego Brando</div>
                <div class="estado">En camino</div>
            </div>
            <button class="btn-cancelar" type="button" onclick="accion(this, 'Entrega cancelada', '#dc3545')">Cancelar entrega</button>
        </div>

        <div class="usuario">
            <div>
                <div class="nombre">Will Graham</div>
                <div class="estado">Listo para validar</div>
            </div>
            <button class="btn-validar" type="button" onclick="accion(this, 'Entrega validada', '#20c997')">Validar entrega</button>
        </div>

        <div class="usuario">
            <div>
                <div class="nombre">Hannibal Lecter</div>
                <div class="estado">En camino</div>
            </div>
            <button class="btn-cancelar" type="button" onclick="accion(this, 'Entrega cancelada', '#dc3545')">Cancelar entrega</button>
        </div>

        <div class="usuario">
            <div>
                <div class="nombre">Arthur Morgan</div>
                <div class="estado">Listo para validar</div>
            </div>
            <button class="btn-validar" type="button" onclick="accion(this, 'Entrega validada', '#20c997')">Validar entrega</button>
        </div>

        <div class="usuario">
            <div>
                <div class="nombre">Dio Brando</div>
                <div class="estado">Listo para validar</div>
            </div>
            <button class="btn-validar" type="button" onclick="accion(this, 'Entrega validada', '#20c997')">Validar entrega</button>
        </div>
    </div>

    <script>
        function accion(boton, textoEstado, color) {
            const tarjeta = boton.closest('.usuario');
            const estado = tarjeta.querySelector('.estado');
            estado.innerText = textoEstado;
            estado.style.color = color;
            boton.disabled = true;
        }
    </script>
</body>
</html>
