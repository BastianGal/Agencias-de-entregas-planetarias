<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso - Agencia de Entregas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
<style>
    .titulo-Hacer_letras_oscuras {
        color: black;
     }
.perfil {
        font-size: 1.2rem;
        color:black;
    }
    .boton-operador {
        background-color: #0056b3;
        color: white;
    }

    .boton-operador:hover {
        background-color: blue;
        color: black;
    }

    .boton-usuario {
       background-color: #0056b3;
        color: white ;
    }

    .boton-usuario:hover {
        background-color: blue;
        color: black;
    }


</style>
    
</head>
<body>

    <div class="container-fluid vh-100">
    <div class="row h-100">
        
        <div class="col-4 bg-white d-flex flex-column justify-content-start pt-5 px-5">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZH_SmBZkOAAa4wy6EhPwFWz0WEU5J71QUyYoun4Uxtw&s=10" alt="Logo" width="160" class="mb-4">
            
            <h2 class="fw-bold titulo-Hacer_letras_oscuras">Entregas Planetarias</h2>
            <p class="perfil">Selecciona tu perfil para ingresar</p>

            <button class="btn boton-operador w-100 mb-2" onclick="iniciarSesion('Operador')">
                Ingresar como Operador
            </button>
            <button class="btn boton-usuario w-100" onclick="iniciarSesion('Usuario General')">
                Ingresar como Usuario
            </button>



            
        </div>

        <div class="col-8 p-0">
            <img src="https://img.magnific.com/foto-gratis/vista-cielo-estrellado-nocturno-paisaje-naturaleza-montanas_23-2151614762.jpg?semt=ais_hybrid&w=740&q=80" alt="Fondo" class="w-100 h-100 foto-derecha">
        </div>

    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
