<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso - Agencia de Entregas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #1a1d20;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tarjeta-acceso {
            background-color: #24282c;
            border: 1px solid #343a40;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
        }

        .boton-operador {
            background-color: #198754;
            border: none;
            font-weight: 500;
        }

        .boton-operador:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>

    <div class="tarjeta-acceso p-4 shadow">
        <div class="text-center mb-4">
            <h1 class="h4 fw-bold text-light mb-1">Entregas Planetarias</h1>
            <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">
                Selección de Perfil
            </span>
        </div>

        <div class="d-grid gap-2">
            <button class="btn boton-operador text-white py-2" onclick="iniciarSesion('Operador')">
                Ingresar como Operador
            </button>
            <button class="btn btn-outline-primary py-2" onclick="iniciarSesion('Usuario General')">
                Ingresar como Usuario
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
