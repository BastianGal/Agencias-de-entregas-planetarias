<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Entregas Planetarias</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2b2f33;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .card {
            background-color: #222;
            border-color: #444;
            color: white;
        }
    </style>
</head>
<body>

    <!-- CAJA UNICA DE INICIO DE SESIÓN CENTRADA -->
    <div class="card p-4 shadow-lg text-center" style="width: 100%; max-width: 380px;">
        <h1 class="h4 mb-2 fw-bold text-primary">🚀 Entregas Planetarias</h1>
        <p class="text-secondary small mb-4">Selecciona tu perfil para ingresar</p>
        
        <button class="btn btn-success btn-lg mb-3 w-100" onclick="iniciarSesion('Operador')">
             Operador
        </button>
        
        <button class="btn btn-primary btn-lg w-100" onclick="iniciarSesion('Usuario General')">
             Usuario General
        </button>
    </div>

    <!-- Script JS -->
    <script src="script.js"></script>
</body>
</html>
